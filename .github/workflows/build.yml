name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Show Swift & Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Build BatteryX (Debug)
        run: swift build -v

      - name: Run Automated Verification Suite
        run: swift run BatteryXTestRunner

      - name: Build BatteryX (Release)
        run: swift build -c release -v
